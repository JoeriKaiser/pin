name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            output_name: pin-linux-amd64
            binary_path: target/x86_64-unknown-linux-gnu/release/pin
          - target: x86_64-apple-darwin
            os: macos-latest
            output_name: pin-macos-amd64
            binary_path: target/x86_64-apple-darwin/release/pin
          - target: aarch64-apple-darwin
            os: macos-latest
            output_name: pin-macos-arm64
            binary_path: target/aarch64-apple-darwin/release/pin
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            output_name: pin-windows-amd64.exe
            binary_path: target/x86_64-pc-windows-msvc/release/pin.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }}
          cp ${{ matrix.binary_path }} ${{ matrix.output_name }}
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.output_name }} > ${{ matrix.output_name }}.sha256
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 ${{ matrix.output_name }} > ${{ matrix.output_name }}.sha256
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.output_name }}
            ${{ matrix.output_name }}.sha256
