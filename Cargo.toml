[package]
name = "pin"
version = "2.0.0"
edition = "2021"
authors = ["Joeri Kaiser"]
description = "A zero-runtime-dependency idea registry for humans and coding agents."
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
rand = "0.8"
tempfile = "3.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[[bin]]
name = "pin"
path = "src/main.rs"
