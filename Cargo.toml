[package]
name = "pin"
# The version comes from the release tag at build time: the release workflow
# sets PIN_VERSION and build.rs otherwise falls back to `git describe`.
# This placeholder is reported only when neither source is available.
version = "0.0.0"
edition = "2021"
authors = ["Joeri Kaiser"]
description = "A local-first, Git-backed work ledger and execution runner for coding agents and orchestrating humans."
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
rand = "0.8"
tempfile = "3.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[[bin]]
name = "pin"
path = "src/main.rs"
